stages:
    - build
    - test
    - docker
    - release
    - singularity
    - release-singularity

variables:
    # recursive should work here, but gitlab-runner does not pull the latest remote
    # for submodules: https://gitlab.com/gitlab-org/gitlab-runner/issues/3011
    GIT_SUBMODULE_STRATEGY:         none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    CONTAINER_TEST_IMAGE: docker.km3net.de/simulation/omgsim:$CI_COMMIT_REF_SLUG
    CONTAINER_RELEASE_IMAGE: docker.km3net.de/simulation/omgsim:$CI_COMMIT_TAG
    CONTAINER_LATEST_IMAGE: docker.km3net.de/simulation/omgsim:latest
    SINGULARITY_RELEASE_IMAGE: omgsim_${CI_COMMIT_TAG}.sif

build:
    image: docker.km3net.de/base/omgsim:4.10.01
    stage: build
    script:
        - source /etc/bashrc
        - source ./setenv.sh
        - rm -rf build
        - mkdir build
        - cd build
        - cmake ..
        - make
    cache:
        untracked: true
    artifacts:
      paths:
          - build
      expire_in: 1 week


test:
    image: docker.km3net.de/base/omgsim:4.10.01
    stage: test
    script:
        - source /etc/bashrc
        - source ./setenv.sh
        - ./scripts/test.sh
    dependencies:
        - build


docker:
    image: docker:stable
    services:
        - docker:dind

    stage: docker
    script:
    - docker build --pull -t $CONTAINER_TEST_IMAGE .
    - docker push $CONTAINER_TEST_IMAGE
    tags:
        - docker
    only:
        - tags
        
release-image:
  image: docker:stable
  services:
    - docker:dind
  stage: release
  script:
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_LATEST_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_LATEST_IMAGE
  tags:
    - docker
  only:
    - tags

singularity:
    image: docker.km3net.de/base/singularity:3.1
    stage: singularity
    script:
        - singularity build $SINGULARITY_RELEASE_IMAGE Singularity
    dependencies:
        - build
    artifacts:
      paths:
        - $SINGULARITY_RELEASE_IMAGE
      expire_in: 1 week
    only:
        - tags

release-singularity:
  image: docker.km3net.de/base/centos-full:7
  stage: release-singularity
  script:
    - lftp -u $KM3NET_SFTP_USER,$KM3NET_SFTP_PASSWORD sftp://$KM3NET_SFTP_HOST -e "set ssl:verify-certificate no; cd singularity/; put $SINGULARITY_RELEASE_IMAGE; bye"
  dependencies:
    - singularity
  only:
    - tags
